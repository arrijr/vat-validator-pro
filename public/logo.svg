  <circle cx="77.6"  cy="35.7"  r="3.5" fill="#FACC15"/> <!-- 306° -->
  <circle cx="88.5"  cy="50.7"  r="3.5" fill="#FACC15"/> <!-- 342° -->
  <circle cx="88.5"  cy="69.3"  r="3.5" fill="#FACC15"/> <!-- 18°  -->
  <circle cx="77.6"  cy="84.3"  r="3.5" fill="#FACC15"/> <!-- 54°  -->
  <circle cx="60.0"  cy="90.0"  r="3.5" fill="#FACC15"/> <!-- 90°  bottom -->
  <circle cx="42.4"  cy="84.3"  r="3.5" fill="#FACC15"/> <!-- 126° -->
